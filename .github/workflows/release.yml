name: Release

# Push a tag like v0.1.0 to publish that version of the `ephemeralos` package to npm.
# Needs an NPM_TOKEN secret: an npm automation token that can publish `ephemeralos`.
on:
  push:
    tags: ['v*']

permissions:
  contents: read
  id-token: write # npm provenance

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: pnpm
          registry-url: https://registry.npmjs.org
      - run: pnpm install --frozen-lockfile
      - run: pnpm check
      - run: pnpm pack:npm
        env:
          EOS_VERSION: ${{ github.ref_name }}
      - run: npm publish dist-npm --provenance --access public
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
